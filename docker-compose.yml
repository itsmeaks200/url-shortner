x-app: &app
  build: .
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
    kafka:
      condition: service_started
  restart: unless-stopped
  # Node as PID 1 ignores SIGTERM without a handler; a tiny init also reaps zombies.
  init: true

x-app-env: &app-env
  PORT: 3000
  POSTGRES_URL: postgres://user:password@postgres:5432/urlshortener
  REDIS_URL: redis://redis:6379
  KAFKA_BROKER: kafka:9092
  BASE_URL: http://localhost
  # Connection budget: keep (apps x this) + (consumers x consumer value) < ~90,
  # Postgres' default max_connections is 100.
  PG_POOL_MAX: 10

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
    restart: unless-stopped

  # Each instance needs a unique WORKER_ID so Snowflake IDs never collide,
  # so these are defined separately rather than using `--scale`.
  app1:
    <<: *app
    environment:
      <<: *app-env
      WORKER_ID: 1

  app2:
    <<: *app
    environment:
      <<: *app-env
      WORKER_ID: 2

  # Kafka click-event consumer, run separately from the HTTP app. Scale with
  #   docker compose up -d --scale consumer=N
  # Useful N is capped by the partition count of the click-events topic.
  consumer:
    <<: *app
    command: ["node", "src/worker.js"]
    environment:
      <<: *app-env
      # One batch at a time per consumer, so it needs very few connections.
      PG_POOL_MAX: 2

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Max parallelism for the consumer group: consumers beyond this count sit idle.
      # Only applies to topics created after this setting; recreate the volume/topic
      # (or use kafka-topics --alter) for an existing click-events topic.
      KAFKA_NUM_PARTITIONS: 6

volumes:
  postgres_data:
