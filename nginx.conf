upstream app_servers {
    # Round-robin by default. Passive health checks: after 3 failures within
    # 10s an instance is skipped for 10s.
    server app1:3000 max_fails=3 fail_timeout=10s;
    server app2:3000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://app_servers;
        proxy_next_upstream error timeout http_502 http_503;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Shows which instance served the request (handy for verifying balancing)
        add_header X-Upstream $upstream_addr always;
    }
}
